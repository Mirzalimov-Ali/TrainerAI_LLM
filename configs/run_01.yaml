vocab_size: 8000
block_size: 256      
n_embd: 384          
n_layer: 6           
n_head: 6            
dropout: 0.1
ffn_mult: 4          
tie_weights: true    

# For training
batch_size: 32
grad_accum_steps: 4
max_steps: 3000
warmup_steps: 100
lr_max: 3.0e-4
min_lr_ratio: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
log_interval: 20
eval_interval: 250
eval_iters: 50
checkpoint_interval: 250
seed: 1337
precision: auto
out_dir: checkpoints